<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Minimalistyczna, prywatna strona startowa. Zero logów, zero analityki.">
    <title>Nowa Karta</title>
    
    <!-- nowoczesny zestaw faviconów -->
    <link rel="icon" href="assets/favicon.ico" sizes="32x32">
    <link rel="icon" href="assets/favicon-96x96.png" type="image/png" sizes="96x96">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    
    <!-- manifest pwa -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="background"></div>

    <main class="container">
        <section class="clock-section">
            <div id="clock" class="clock">00:00:00</div>
            <div id="date" class="date">Poniedziałek, 1 stycznia</div>
        </section>

        <div class="greeting-container">
            <h1 id="greeting" class="greeting">Dzień dobry</h1>
            <div id="privacy-quote" class="privacy-quote"></div>
        </div>

        <section class="search-section">
            <div class="search-wrapper">
                <select id="engine-select" class="engine-select" aria-label="Wybierz wyszukiwarkę">
                    <option value="duckduckgo">DuckDuckGo</option>
                    <option value="startpage">Startpage</option>
                    <option value="brave">Brave Search</option>
                    <option value="qwant">Qwant</option>
                    <option value="searxng_lab042">SearXNG (lab042)</option>
                </select>
                <form id="search-form" class="search-form" role="search">
                    <input 
                        type="text" 
                        id="search-input" 
                        class="search-input" 
                        placeholder="Szukaj..." 
                        autocomplete="off"
                        aria-label="Wpisz zapytanie"
                    >
                    <button type="submit" class="search-button" aria-label="Szukaj">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                </form>
            </div>
        </section>

        <!-- sekcja kafelków ze skrótami -->
        <section id="shortcuts-section" class="shortcuts-section">
            <div id="shortcuts-grid" class="shortcuts-grid">
                <!-- kafelki będą generowane dynamicznie przez JS -->
            </div>
            <button id="add-shortcut-btn" class="add-shortcut-btn" aria-label="Dodaj skrót">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </section>
    </main>

    <footer class="footer">
        <button id="settings-btn" class="settings-btn" aria-label="Ustawienia">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
    </footer>

    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Ustawienia</h2>
            
            <div class="setting-group">
                <label for="bg-upload">Tło (obraz)</label>
                <input type="file" id="bg-upload" accept="image/*">
                <button id="bg-reset" class="btn-secondary">Przywróć domyślne</button>
            </div>

            <div class="setting-group">
                <label for="engine-select-modal">Domyślna wyszukiwarka</label>
                <select id="engine-select-modal">
                    <option value="duckduckgo">DuckDuckGo</option>
                    <option value="startpage">Startpage</option>
                    <option value="brave">Brave Search</option>
                    <option value="qwant">Qwant</option>
                    <option value="searxng_lab042">SearXNG (lab042)</option>
                </select>
            </div>

            <button id="close-settings" class="btn-primary">Zamknij</button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <!-- db.js musi być załadowany przed script.js -->
    <script src="js/db.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
