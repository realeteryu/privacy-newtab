<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Privacy NewTab – Prywatna Nowa Karta</title>
    <meta name="description" content="Minimalistyczna, w 100% prywatna nowa karta i strona startowa. Zero logów, zero analityki, zero backendu. Działa w 100% lokalnie (Local-First).">

    <!-- og image i social media -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://newtab.eteryu.space/">
    <meta property="og:title" content="Privacy NewTab – Prywatna Nowa Karta">
    <meta property="og:description" content="Minimalistyczna, w 100% prywatna nowa karta i strona startowa. Zero logów, zero analityki, zero backendu. Działa w 100% lokalnie (Local-First).">
    <meta property="og:image" content="https://newtab.eteryu.space/assets/og-image.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Privacy NewTab – Prywatna Nowa Karta">
    <meta name="twitter:description" content="Minimalistyczna, w 100% prywatna nowa karta i strona startowa. Zero logów i śledzenia.">
    <meta name="twitter:image" content="https://newtab.eteryu.space/assets/og-image.png">
    
    <!-- favicony -->
    <link rel="icon" href="assets/favicon.ico" sizes="32x32">
    <link rel="icon" href="assets/favicon-96x96.png" type="image/png" sizes="96x96">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    
    <!-- manifest pwa -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">

    <!-- style -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="background"></div>

    <main class="container">
        <!-- zegar -->
        <section class="clock-section">
            <div id="clock" class="clock">00:00:00</div>
            <div id="date" class="date">Poniedziałek, 1 stycznia</div>
        </section>

        <!-- powitanie -->
        <div class="greeting-container">
            <h1 id="greeting" class="greeting">Dzień dobry</h1>
            <div id="privacy-quote" class="privacy-quote"></div>
        </div>

        <!-- wyszukiwarka -->
        <section class="search-section">
            <div class="search-wrapper">
                <select id="engine-select" class="engine-select" aria-label="Wybierz wyszukiwarkę">
                    <!-- opcje generowane przez js/engines.js -->
                </select>
                <form id="search-form" class="search-form" role="search">
                    <input 
                        type="text" 
                        id="search-input" 
                        class="search-input" 
                        placeholder="Szukaj..." 
                        autocomplete="off"
                        aria-label="Wpisz zapytanie"
                    >
                    <button type="submit" class="search-button" aria-label="Szukaj">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                </form>
            </div>
        </section>

        <!-- kafelki -->
        <section id="shortcuts-section" class="shortcuts-section">
            <div id="shortcuts-grid" class="shortcuts-grid">
                <!-- generowane przez js -->
            </div>
            <button id="add-shortcut-btn" class="add-shortcut-btn" aria-label="Dodaj skrót">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </section>
    </main>

    <!-- stopka / ustawienia -->
    <footer class="footer">
        <button id="privacy-mode-btn" class="icon-btn" aria-label="Tryb prywatny" title="Ukryj kafelki">
            <!-- ikona oka (domyślna) -->
            <svg id="eye-open" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <!-- ikona przekreślonego oka (ukryta domyślnie) -->
            <svg id="eye-closed" class="hidden" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
        </button>
        <button id="settings-btn" class="icon-btn" aria-label="Ustawienia">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
    </footer>

    <!-- modal ustawień -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Ustawienia</h2>
            
            <div class="setting-group">
                <label for="bg-upload">Tło (obraz)</label>
                <input type="file" id="bg-upload" accept="image/*">
                <button id="bg-reset" class="btn-secondary">Przywróć domyślne</button>
            </div>

            <div class="setting-group">
                <label for="engine-select-modal">Domyślna wyszukiwarka</label>
                <select id="engine-select-modal">
                    <!-- opcje generowane przez js/engines.js -->
                </select>
            </div>

            <!-- sekcja własnych wyszukiwarek -->
            <div class="setting-group backup-section">
                <label>Dodaj własną wyszukiwarkę</label>
                <input type="text" id="custom-engine-name" placeholder="Nazwa (np. Moja SearXNG)">
                <input type="text" id="custom-engine-url" placeholder="URL z %s (np. https://.../search?q=%s)">
                <button id="add-engine-btn" class="btn-secondary">Dodaj wyszukiwarkę</button>
                <div id="custom-engines-list" class="custom-engines-list"></div>
            </div>

            <!-- sekcja kopii zapasowej -->
            <div class="setting-group backup-section">
                <label>Kopia zapasowa ustawień</label>
                <button id="export-settings-btn" class="btn-secondary">Eksportuj do pliku (JSON)</button>
                <button id="import-settings-btn" class="btn-secondary">Importuj z pliku</button>
                <input type="file" id="import-file-input" accept=".json" class="hidden-input">
            </div>

            <button id="close-settings" class="btn-primary">Zamknij</button>
        </div>
    </div>

    <!-- modal skrótu -->
    <div id="shortcut-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Dodaj skrót</h2>
            
            <div class="setting-group">
                <label for="shortcut-name">Nazwa skrótu</label>
                <input type="text" id="shortcut-name" placeholder="np. GitHub">
            </div>

            <div class="setting-group">
                <label for="shortcut-url">Adres URL</label>
                <input type="text" id="shortcut-url" placeholder="np. https://github.com">
            </div>

            <div class="setting-group">
                <label for="shortcut-icon-upload">Własna ikona (opcjonalnie)</label>
                <input type="file" id="shortcut-icon-upload" accept="image/*">
            </div>

            <button id="save-shortcut-btn" class="btn-primary">Dodaj</button>
            <button id="cancel-shortcut-btn" class="btn-secondary">Anuluj</button>
        </div>
    </div>

    <!-- skrypty -->
    <script src="js/data.js"></script>
    <script src="js/db.js"></script>
    <script src="js/engines.js"></script>
    <script src="js/background.js"></script>
    <script src="js/shortcuts.js"></script>
    <!-- script.js musi być na końcu, bo wywołuje funkcje z powyższych plików -->
    <script src="js/script.js"></script>
    <!-- backup.js na samym końcu, bo korzysta ze wszystkich modułów -->
    <script src="js/backup.js"></script>
</body>
</html>
